<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitHub Demo App - CuongQuocNguyen22</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: rgba(22, 27, 34, 0.75);
      --border: rgba(240, 246, 252, 0.1);
      --text: #f0f6fc;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --accent-gradient: linear-gradient(135deg, #7928ca, #ff0080);
      --success: #3fb950;
      --glow: rgba(88, 166, 255, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(121, 40, 202, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(255, 0, 128, 0.15) 0%, transparent 40%);
    }

    .container {
      max-width: 800px;
      width: 100%;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      animation: fadeIn 0.8s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .header {
      text-align: center;
      margin-bottom: 36px;
    }

    .badge {
      display: inline-block;
      padding: 6px 16px;
      background: rgba(63, 185, 80, 0.15);
      color: var(--success);
      border: 1px solid rgba(63, 185, 80, 0.3);
      border-radius: 20px;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 36px;
    }

    .card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      transition: all 0.3s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
      box-shadow: 0 8px 24px var(--glow);
    }

    .card h3 {
      font-size: 1.1rem;
      margin-bottom: 8px;
      color: var(--accent);
    }

    .card p {
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    .interactive-section {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      border: 1px solid var(--border);
    }

    .counter-btn {
      background: var(--accent-gradient);
      color: white;
      border: none;
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: 600;
      font-family: inherit;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      margin-top: 12px;
    }

    .counter-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(255, 0, 128, 0.4);
    }

    .counter-btn:active {
      transform: scale(0.98);
    }

    .footer {
      margin-top: 32px;
      text-align: center;
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .footer a {
      color: var(--accent);
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="badge">✓ GitHub Connected</div>
      <h1>Xin chào từ GitHub App!</h1>
      <p class="subtitle">Dự án mẫu khởi tạo thành công bởi Antigravity Agent</p>
    </div>

    <div class="card-grid">
      <div class="card">
        <h3>👤 Developer</h3>
        <p id="dev-name">Cường (CuongQuocNguyen22)</p>
      </div>
      <div class="card">
        <h3>🚀 Framework</h3>
        <p>HTML5 / CSS3 / Vanilla JS</p>
      </div>
      <div class="card">
        <h3>⚡ Status</h3>
        <p>Connected & Deployed</p>
      </div>
    </div>

    <div class="interactive-section">
      <h3 style="margin-bottom: 8px;">Thử tương tác</h3>
      <p style="color: var(--text-muted); font-size: 0.9rem;">Số lần bấm: <span id="count" style="color: var(--text); font-weight: bold; font-size: 1.2rem;">0</span></p>
      <button class="counter-btn" id="click-btn">Tăng Số Lượng ✨</button>
    </div>

    <div class="footer">
      <p>Pushed to GitHub via <a href="https://cli.github.com" target="_blank">GitHub CLI</a></p>
    </div>
  </div>

  <script>
    let count = 0;
    const countEl = document.getElementById('count');
    const btn = document.getElementById('click-btn');

    btn.addEventListener('click', () => {
      count++;
      countEl.textContent = count;
      btn.style.transform = 'scale(0.95)';
      setTimeout(() => {
        btn.style.transform = '';
      }, 100);
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game Rắn Săn Mồi (Snake Game) - Cyberpunk Edition</title>
  <meta name="description" content="Trò chơi Rắn Săn Mồi phong cách Cyberpunk Neon hiện đại với hiệu ứng âm thanh sống động và nhiều chế độ chơi." />
  
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="game-container">
    <!-- Header -->
    <header class="header">
      <div class="title-wrap">
        <span style="font-size: 1.5rem;">🐍</span>
        <h1 class="game-title">RẮN SĂN MỒI</h1>
      </div>
      <p class="subtitle">Cyberpunk Neon Edition</p>
    </header>

    <!-- Scoreboard -->
    <div class="score-board">
      <div class="score-card">
        <span class="score-label">Điểm Số</span>
        <span class="score-val" id="score">0</span>
      </div>
      <div class="score-card">
        <span class="score-label">Kỷ Lục</span>
        <span class="score-val high-score-val" id="highScore">0</span>
      </div>
      <div class="score-card">
        <span class="score-label">Đã Ăn</span>
        <span class="score-val food-count-val" id="foodCount">0</span>
      </div>
    </div>

    <!-- Options Bar -->
    <div class="options-bar">
      <div style="display: flex; align-items: center; gap: 8px;">
        <label for="difficultySelect" style="font-size: 0.85rem; color: var(--text-muted); font-weight: 600;">Độ Khó:</label>
        <select id="difficultySelect" class="difficulty-select">
          <option value="easy">🟢 Dễ (Xuyên Tường)</option>
          <option value="medium" selected>🟡 Trung Bình (Bình Thường)</option>
          <option value="hard">🔴 Khó (Có Vật Cản)</option>
        </select>
      </div>

      <button id="btnSound" class="sound-btn" title="Bật/Tắt Âm Thanh">🔊</button>
    </div>

    <!-- Canvas Play Area -->
    <div class="canvas-wrapper">
      <canvas id="gameCanvas" width="400" height="400"></canvas>

      <!-- Overlay Screen (Paused / Initial) -->
      <div id="canvasOverlay" class="canvas-overlay">
        <div class="overlay-text" id="overlayText">SẴN SÀNG CHƠI?</div>
        <div class="overlay-subtext" id="overlaySubtext">Bấm nút "Bắt Đầu" bên dưới để chơi!</div>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="action-buttons">
      <button id="btnStart" class="btn btn-primary">🎮 Bắt Đầu</button>
      <button id="btnPause" class="btn btn-secondary">⏸ Tạm Dừng</button>
    </div>

    <!-- Food Legend -->
    <div class="food-legend">
      <div class="legend-item">
        <span class="dot dot-red"></span> Táo Đỏ (+10)
      </div>
      <div class="legend-item">
        <span class="dot dot-gold"></span> Táo Vàng (+30)
      </div>
      <div class="legend-item">
        <span class="dot dot-blue"></span> Táo Xanh (+20)
      </div>
    </div>

    <!-- Touch D-Pad for Mobile -->
    <div class="dpad-container">
      <button class="dpad-btn d-up" data-dir="up">▲</button>
      <button class="dpad-btn d-left" data-dir="left">◀</button>
      <button class="dpad-btn d-right" data-dir="right">▶</button>
      <button class="dpad-btn d-down" data-dir="down">▼</button>
    </div>

    <!-- Keyboard Hint -->
    <div class="kbd-hint">
      Điều khiển bằng phím <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / <kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd> | Tạm dừng: <kbd>Space</kbd>
    </div>
  </div>

  <!-- Game Over Modal -->
  <div id="modalBackdrop" class="modal-backdrop">
    <div class="modal-card">
      <div style="font-size: 2.5rem;">💀</div>
      <h2 class="game-over-title">GAME OVER</h2>
      
      <div class="final-score-box">
        <span style="color: var(--text-muted); font-size: 0.9rem;">Tổng Điểm Của Bạn</span>
        <span id="finalScore" style="font-size: 2.2rem; font-weight: 800; color: var(--neon-cyan); font-family: 'Press Start 2P', cursive;">0</span>
        <div id="newHighScoreBadge" class="new-high-score-badge" style="display: none;">🏆 KỶ LỤC MỚI!</div>
      </div>

      <button id="btnRestart" class="btn btn-primary" style="width: 100%;">🔄 Chơi Lại Ván Mới</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
